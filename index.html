<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VidFetch — High-Quality Video Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #0a0a0f; }
    .glow { box-shadow: 0 0 60px rgba(139, 92, 246, 0.15); }
    .input-glow:focus { box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.3); }
    .gradient-text {
      background: linear-gradient(135deg, #a78bfa 0%, #818cf8 50%, #60a5fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card-hover:hover { transform: translateY(-2px); transition: all 0.2s ease; }
  </style>
</head>
<body class="min-h-screen text-white">

  <nav class="relative z-10 flex items-center justify-between px-6 md:px-12 py-6 max-w-7xl mx-auto">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-500 to-blue-500 flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
      </div>
      <span class="text-xl font-bold tracking-tight">VidFetch</span>
    </div>
  </nav>

  <main class="relative z-10 max-w-4xl mx-auto px-6 pt-16 md:pt-24 pb-20">
    <div class="text-center mb-10">
      <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight leading-tight mb-4">
        Download videos in<br />
        <span class="gradient-text">crystal-clear quality</span>
      </h1>
      <p class="text-gray-400 text-lg max-w-xl mx-auto">
        Paste any video link. Get MP4 up to 4K, no watermarks, no sign-up required.
      </p>
    </div>

    <!-- Input Card -->
    <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-2 glow">
      <div class="flex flex-col md:flex-row gap-2">
        <div class="flex-1 relative">
          <input
            id="videoUrl"
            type="url"
            placeholder="Paste video URL here..."
            class="w-full bg-transparent text-white placeholder-gray-500 px-4 py-4 rounded-xl outline-none input-glow transition text-sm md:text-base"
          />
        </div>
        <button
          id="fetchBtn"
          onclick="handleFetch()"
          class="bg-gradient-to-r from-violet-600 to-blue-600 hover:from-violet-500 hover:to-blue-500 text-white font-semibold px-8 py-4 rounded-xl transition-all flex items-center justify-center gap-2 whitespace-nowrap"
        >
          <span id="btnText">Fetch Video</span>
        </button>
      </div>
    </div>

    <div id="statusBox" class="hidden mt-4 p-4 rounded-xl text-sm"></div>
    <div id="resultArea" class="hidden mt-8 space-y-4"></div>

    <div id="loadingArea" class="hidden mt-8">
      <div class="bg-white/5 border border-white/10 rounded-2xl p-6 animate-pulse">
        <div class="flex gap-4">
          <div class="w-40 h-24 bg-white/10 rounded-lg"></div>
          <div class="flex-1 space-y-3">
            <div class="h-4 bg-white/10 rounded w-3/4"></div>
            <div class="h-3 bg-white/10 rounded w-1/2"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Your Cloudflare Worker URL
    const API_BASE = 'https://vidfetch-api.dropshare2026.workers.dev';

    async function handleFetch() {
      const urlInput = document.getElementById('videoUrl');
      const url = urlInput.value.trim();
      const statusBox = document.getElementById('statusBox');
      const resultArea = document.getElementById('resultArea');
      const loadingArea = document.getElementById('loadingArea');
      const btn = document.getElementById('fetchBtn');
      const btnText = document.getElementById('btnText');

      statusBox.classList.add('hidden');
      resultArea.classList.add('hidden');
      resultArea.innerHTML = '';

      if (!url) {
        showStatus('Please paste a video URL first.', 'error');
        return;
      }

      loadingArea.classList.remove('hidden');
      btn.disabled = true;
      btnText.textContent = 'Fetching... (may take 30s to wake server)';

      try {
        const resp = await fetch(`${API_BASE}/api/extract`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const data = await resp.json();

        if (!resp.ok) {
          throw new Error(data.error || 'Extraction failed.');
        }

        if (data.error) {
           throw new Error(data.error);
        }

        renderResults(data);
      } catch (err) {
        showStatus(err.message, 'error');
      } finally {
        loadingArea.classList.add('hidden');
        btn.disabled = false;
        btnText.textContent = 'Fetch Video';
      }
    }

    function renderResults(data) {
      const area = document.getElementById('resultArea');
      area.classList.remove('hidden');

      let html = `
        <div class="bg-white/5 border border-white/10 rounded-2xl p-6">
          <div class="flex flex-col md:flex-row gap-5">
            ${data.thumbnail ? `<img src="${data.thumbnail}" class="w-full md:w-48 h-28 object-cover rounded-xl" />` : ''}
            <div class="flex-1 min-w-0">
              <h3 class="font-semibold text-lg truncate">${escapeHtml(data.title || 'Video')}</h3>
              <p class="text-sm text-gray-400 mt-1">${escapeHtml(data.author || 'Unknown')}</p>
            </div>
          </div>
          <div class="mt-5 space-y-2">
            <p class="text-xs text-gray-500 uppercase tracking-wider font-medium">Available Formats</p>
      `;

      (data.formats || []).forEach((f) => {
        html += `
          <div class="flex items-center justify-between bg-white/5 hover:bg-white/10 rounded-xl px-4 py-3 transition">
            <div class="flex items-center gap-3">
              <span class="text-xs font-mono bg-violet-500/20 text-violet-300 px-2 py-0.5 rounded">${f.quality || 'HD'}</span>
              <span class="text-sm text-gray-300">${f.ext?.toUpperCase() || 'MP4'} ${f.filesize ? '· ' + f.filesize : ''}</span>
            </div>
            <a href="${f.url}" target="_blank" rel="noopener"
               class="text-sm font-medium bg-gradient-to-r from-violet-600 to-blue-600 hover:from-violet-500 hover:to-blue-500 px-4 py-2 rounded-lg transition">
              Download
            </a>
          </div>
        `;
      });

      html += `</div></div>`;
      area.innerHTML = html;
    }

    function showStatus(msg, type) {
      const box = document.getElementById('statusBox');
      box.classList.remove('hidden');
      box.className = `mt-4 p-4 rounded-xl text-sm ${
        type === 'error'
          ? 'bg-red-500/10 border border-red-500/20 text-red-300'
          : 'bg-green-500/10 border border-green-500/20 text-green-300'
      }`;
      box.textContent = msg;
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    document.getElementById('videoUrl').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleFetch();
    });
  </script>
</body>
</html>
